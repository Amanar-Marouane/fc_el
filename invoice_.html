<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Manager (Standalone)</title>
    <style>
      :root { --red:#be1e2d; --bg:#f8f9fa; --text:#171717; }
      * { box-sizing:border-box; }
      body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
      .app { min-height:100vh; padding-bottom:32px; }
      .topbar { position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid #e5e7eb; }
      .wrap { max-width:1200px; margin:0 auto; padding:0 16px; }
      .topbar .row { height:64px; display:flex; align-items:center; justify-content:space-between; }
      .logo { display:flex; align-items:center; gap:8px; font-weight:700; }
      .logo .i { width:32px; height:32px; border-radius:6px; background:var(--red); color:#fff; display:grid; place-items:center; font-size:20px; }
      .btn { border:1px solid #e5e7eb; background:#fff; color:#444; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; }
      .btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
      .btn.dark { background:#171717; border-color:#171717; color:#fff; }
      .main { padding:24px 16px; }
      .grid { display:grid; grid-template-columns:2fr 1fr; gap:24px; }
      .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
      .card h2 { margin:0; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#6b7280; padding:16px 20px; border-bottom:1px solid #f0f0f0; }
      .card .body { padding:20px; }
      .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; }
      label { display:block; font-size:11px; text-transform:uppercase; color:#9ca3af; font-weight:700; margin-bottom:4px; }
      input { width:100%; border:1px solid #e5e7eb; border-radius:10px; padding:10px; font-size:14px; }
      .items-top { display:grid; grid-template-columns:1fr 100px 140px auto; gap:10px; margin-bottom:16px; align-items:end; }
      table { width:100%; border-collapse:collapse; }
      .ui-table th,.ui-table td { padding:10px 12px; border-bottom:1px solid #f1f1f1; font-size:14px; }
      .ui-table thead th { color:#6b7280; font-weight:700; background:#fafafa; text-align:left; }
      .ui-table .r { text-align:right; } .ui-table .c { text-align:center; }
      .danger { color:#dc2626; cursor:pointer; border:0; background:none; font-weight:700; }
      .hint { margin-top:14px; background:#eff6ff; border:1px solid #dbeafe; color:#1d4ed8; border-radius:12px; padding:12px; font-size:12px; }
      .stats { display:grid; gap:8px; }
      .stats .line { display:flex; justify-content:space-between; font-size:14px; }
      .stats .total { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; }
      .stats .total b { color:var(--red); font-size:32px; }

      .modal { position:fixed; inset:0; z-index:50; background:rgba(23,23,23,.65); padding:8px; overflow:auto; display:none; }
      .modal.open { display:block; }
      .modal-inner { max-width:220mm; margin:12px auto; background:#f5f5f5; border-radius:10px; padding:4px; box-shadow:0 10px 30px rgba(0,0,0,.18); }
      .modal-toolbar { display:flex; justify-content:space-between; gap:8px; align-items:center; border-bottom:1px solid #e5e7eb; background:#fff; padding:12px 14px; border-radius:8px 8px 0 0; }
      .dots { display:flex; gap:8px; align-items:center; color:#9ca3af; font-size:13px; font-weight:700; }
      .dot { width:10px; height:10px; border-radius:999px; }
      .r1 { background:#f87171; } .r2 { background:#fbbf24; } .r3 { background:#4ade80; }
      .invoice-shell { background:#fff; padding:8px; }

      #invoice-page { width:210mm; min-height:287mm; margin:0 auto; background:#fff; border:1px solid #d1d5db; padding:0 12mm; color:#171717; }
      .header-img { margin:0 0 3mm; border-bottom:2px solid #000; padding-bottom:2mm; }
      .header-img img { width:100%; max-height:36mm; object-fit:contain; display:block; }
      .brand { font-size:11px; color:#374151; font-weight:600; border:1px solid #d1d5db; background:#f3f4f6; border-radius:999px; padding:8px 10px; display:grid; grid-template-columns:1.6fr 1fr auto; gap:14px; align-items:center; }
      .brand .icon { width:14px; height:14px; flex:none; }
      .brand .loc, .brand .social, .brand .contact { display:flex; align-items:center; gap:6px; }
      .brand .social { justify-content:center; }
      .headline { margin:3mm 0 2mm; display:flex; justify-content:space-between; align-items:end; gap:8px; }
      .headline h1 { margin:0; color:var(--red); font-size:15pt; letter-spacing:1.5px; }
      .meta-grid { margin:3mm 0 4mm; display:grid; grid-template-columns:1fr 1fr; gap:4mm 10mm; font-size:10.2pt; }
      .meta-row { display:flex; align-items:baseline; gap:2mm; }
      .meta-row .label { font-weight:700; }
      .meta-row .value { flex:1; min-height:4.7mm; }
      .meta-row .empty { border-bottom:1px dotted #6b7280; }
      .rtl { direction:rtl; text-align:right; }

      .invoice-lines-table { margin-top:4mm; border:1px solid #171717; table-layout:fixed; font-size:10pt; }
      .invoice-lines-table th,.invoice-lines-table td { border:1px solid #171717; padding:1.8mm 2.2mm; vertical-align:top; }
      .invoice-lines-table thead th { background:var(--red); color:#fff; text-align:center; font-weight:700; }
      .invoice-lines-table .w1 { width:48%; }
      .invoice-lines-table .wq { width:14%; }
      .invoice-lines-table .wu { width:18%; }
      .invoice-lines-table .wt { width:20%; }
      .invoice-lines-table .unit-col { overflow-wrap:anywhere; word-break:break-word; }
      .invoice-lines-table .total-col { overflow-wrap:anywhere; word-break:break-word; }
      .invoice-lines-table tfoot td { background:var(--red); color:#fff; text-align:center; font-weight:700; }
      .cond-title { margin-top:5mm; border:1px solid #171717; background:var(--red); color:#fff; text-align:center; font-weight:700; font-size:10pt; padding:2mm 3mm; }
      .cond-body { border:1px solid #171717; border-top:0; padding:2.5mm 3mm; font-size:9.3pt; }
      .sig { margin-top:15mm; font-size:11pt; font-weight:700; }
      .sig-line { display:inline-block; width:65mm; border-bottom:1px solid #404040; transform:translateY(-2px); }
      .nowrap { white-space:nowrap; } .tcenter { text-align:center; } .tright { text-align:right; }

      @media (max-width: 1024px) {
        .grid { grid-template-columns:1fr; }
        .fields { grid-template-columns:1fr; }
      }

      @page { size:A4; margin:8mm 0; }
      @media print {
        body, html { width:100%; min-height:297mm; margin:0; padding:0; background:#fff !important; color:#171717; -webkit-print-color-adjust:exact; print-color-adjust:exact; overflow:visible; }
        .topbar, .main, .modal-toolbar { display:none !important; }
        .modal { position:fixed !important; inset:0 !important; display:block !important; background:#fff !important; padding:0 !important; }
        .modal-inner { margin:0 !important; max-width:none !important; min-height:100vh !important; width:100% !important; box-shadow:none !important; border-radius:0 !important; padding:0 !important; background:#fff !important; }
        .invoice-shell { background:#fff !important; padding:0 !important; }
        #invoice-page { width:210mm; min-height:auto; margin:0 auto !important; border:0 !important; box-shadow:none !important; background:#fff !important; page-break-after:auto; break-after:auto; }
        .invoice-lines-table thead { display:table-header-group; }
        .invoice-lines-table tfoot { display:table-footer-group; page-break-inside:avoid; break-inside:avoid-page; }
        .invoice-lines-table tr, .invoice-lines-table td, .invoice-lines-table th { page-break-inside:avoid; break-inside:avoid-page; }
        .invoice-row-before-total { page-break-after:avoid; break-after:avoid-page; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="wrap row">
          <div class="logo"><div class="i">I</div><div>Invoice Manager</div></div>
          <button id="previewBtn" class="btn primary">Preview Invoice</button>
        </div>
      </header>

      <main class="main wrap">
        <div class="grid">
          <div>
            <section class="card">
              <h2>Client Details / معلومات الزبون</h2>
              <div class="body fields">
                <div><label>Full Name</label><input id="customerName" placeholder="Nom" /></div>
                <div><label class="tright">الاسم الكامل</label><input id="customerNameAr" dir="rtl" /></div>
                <div><label>Phone Number</label><input id="phone" placeholder="N° Tél" /></div>
                <div><label class="tright">رقم الهاتف</label><input id="phoneAr" dir="rtl" /></div>
                <div><label>City</label><input id="city" placeholder="Ville" /></div>
                <div><label class="tright">المدينة</label><input id="cityAr" dir="rtl" /></div>
                <div><label>Client ID</label><input id="clientId" placeholder="ID du client" /></div>
                <div><label class="tright">معرف الزبون</label><input id="clientIdAr" dir="rtl" /></div>
              </div>
            </section>

            <section class="card" style="margin-top:16px;">
              <h2>Invoice Items / الأجهزة</h2>
              <div class="body">
                <div class="items-top">
                  <div><label>Appareil</label><input id="itemName" placeholder="Description" /></div>
                  <div><label>Qté</label><input id="itemQty" type="number" min="0" value="1" /></div>
                  <div><label>Prix (MAD)</label><input id="itemPrice" type="number" min="0" step="0.01" value="0" /></div>
                  <button id="addItemBtn" class="btn dark">Ajouter</button>
                </div>
                <table class="ui-table" id="itemsTable"></table>
              </div>
            </section>
          </div>

          <div>
            <section class="card">
              <h2>Logistics</h2>
              <div class="body">
                <div><label>Date facture</label><input id="invoiceDate" type="date" /></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
                  <div><label>Début garantie</label><input id="warrantyStart" type="date" /></div>
                  <div><label>Fin garantie</label><input id="warrantyEnd" type="date" /></div>
                </div>
                <div class="stats" style="margin-top:16px;padding-top:14px;border-top:1px solid #f1f1f1;">
                  <div class="line"><span style="color:#6b7280">Articles</span><b id="sumQty">0</b></div>
                  <div class="total"><span style="color:#6b7280;font-weight:700;">Total TTC</span><b id="sumTotal">MAD 0.00</b></div>
                </div>
              </div>
            </section>
            <div class="hint">Une fois le formulaire rempli, cliquez sur <b>Preview Invoice</b> pour générer le document prêt à l'impression.</div>
          </div>
        </div>
      </main>
    </div>

    <div id="modal" class="modal">
      <div class="modal-inner" id="modalInner">
        <div class="modal-toolbar">
          <div class="dots"><span class="dot r1"></span><span class="dot r2"></span><span class="dot r3"></span><span>Invoice Preview</span></div>
          <div style="display:flex;gap:8px;">
            <button id="printBtn" class="btn dark">Print Document</button>
            <button id="closeBtn" class="btn">Close</button>
          </div>
        </div>
        <div class="invoice-shell">
          <div id="invoiceContainer"></div>
        </div>
      </div>
    </div>

    <script>
      const state = {
        customerName: "", customerNameAr: "", phone: "", phoneAr: "", city: "", cityAr: "",
        clientId: "", clientIdAr: "", warrantyStart: "", warrantyEnd: "",
        invoiceDate: new Date().toISOString().slice(0, 10),
        lines: []
      };

      const fmtMoney = (n) => new Intl.NumberFormat("fr-MA", { style:"currency", currency:"MAD", maximumFractionDigits:2 }).format(Number(n || 0));
      const byId = (id) => document.getElementById(id);

      function bindInputs() {
        ["customerName","customerNameAr","phone","phoneAr","city","cityAr","clientId","clientIdAr","warrantyStart","warrantyEnd","invoiceDate"]
          .forEach((k) => {
            const el = byId(k);
            el.value = state[k] || "";
            el.addEventListener("input", (e) => {
              state[k] = e.target.value;
              renderUIItems();
            });
          });
      }

      function renderUIItems() {
        const qty = state.lines.reduce((s, l) => s + Number(l.quantity || 0), 0);
        const total = state.lines.reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0), 0);
        byId("sumQty").textContent = qty;
        byId("sumTotal").textContent = fmtMoney(total);

        const t = byId("itemsTable");
        let html = `
          <thead><tr><th>Appareil</th><th class="c">Qté</th><th class="r">Prix Unit.</th><th class="r">Total</th><th class="c">Action</th></tr></thead><tbody>
        `;
        if (!state.lines.length) {
          html += `<tr><td colspan="5" class="tcenter" style="padding:28px;color:#9ca3af;font-style:italic;">Aucun appareil ajouté pour le moment</td></tr>`;
        } else {
          html += state.lines.map((l, i) => `
            <tr>
              <td>${escapeHtml(l.appliance)}</td>
              <td class="c">${Number(l.quantity || 0)}</td>
              <td class="r">${fmtMoney(l.unitPrice)}</td>
              <td class="r"><b>${fmtMoney(Number(l.quantity || 0) * Number(l.unitPrice || 0))}</b></td>
              <td class="c"><button class="danger" data-del="${i}">Delete</button></td>
            </tr>`).join("");
        }
        html += `</tbody>`;
        t.innerHTML = html;
        t.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => {
          state.lines.splice(Number(b.dataset.del), 1);
          renderUIItems();
        }));
      }

      function escapeHtml(v) {
        return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
      }

      function invoiceHtml() {
        const totalAmount = state.lines.reduce((s, l) => s + Number(l.quantity || 0) * Number(l.unitPrice || 0), 0);
        const totalQty = state.lines.reduce((s, l) => s + Number(l.quantity || 0), 0);
        const minRows = 5;
        const extraRows = Math.max(minRows - Math.max(state.lines.length, 1), 0);
        const wStart = state.warrantyStart || "__ / __ / ____";
        const wEnd = state.warrantyEnd || "__ / __ / ____";

        let rows = "";
        if (!state.lines.length) {
          rows += `<tr><td class="h"></td><td></td><td></td><td></td></tr>`;
        } else {
          rows += state.lines.map((l, i) => {
            const isRowBeforeTotal = i === state.lines.length - 1 && extraRows === 0;
            return `<tr class="${isRowBeforeTotal ? "invoice-row-before-total" : ""}">
              <td>${escapeHtml(l.appliance || "-")}</td>
              <td class="tcenter">${Number(l.quantity || 0)}</td>
              <td class="tright unit-col">${fmtMoney(l.unitPrice)}</td>
              <td class="tright">${fmtMoney(Number(l.quantity || 0) * Number(l.unitPrice || 0))}</td>
            </tr>`;
          }).join("");
        }
        for (let i = 0; i < extraRows; i++) {
          rows += `<tr class="${i === extraRows - 1 ? "invoice-row-before-total" : ""}"><td class="h"></td><td></td><td></td><td></td></tr>`;
        }

        return `

            <div class="headline"><h1>FACTURE / BON DE GARANTIE</h1><span><b>Date:</b> ${escapeHtml(state.invoiceDate || "-")}</span></div>
            <section class="meta-grid">
              <div class="meta-row"><span class="label">Nom :</span><span class="value ${state.customerName ? "" : "empty"}">${escapeHtml(state.customerName)}</span></div>
              <div class="meta-row rtl"><span class="label">:الاسم</span><span class="value ${state.customerNameAr ? "" : "empty"}">${escapeHtml(state.customerNameAr)}</span></div>
              <div class="meta-row"><span class="label">N° Tél :</span><span class="value ${state.phone ? "" : "empty"}">${escapeHtml(state.phone)}</span></div>
              <div class="meta-row rtl"><span class="label">:رقم الهاتف</span><span class="value ${state.phoneAr ? "" : "empty"}">${escapeHtml(state.phoneAr)}</span></div>
              <div class="meta-row"><span class="label">Ville :</span><span class="value ${state.city ? "" : "empty"}">${escapeHtml(state.city)}</span></div>
              <div class="meta-row rtl"><span class="label">:المدينة</span><span class="value ${state.cityAr ? "" : "empty"}">${escapeHtml(state.cityAr)}</span></div>
              <div class="meta-row"><span class="label">ID du client :</span><span class="value ${state.clientId ? "" : "empty"}">${escapeHtml(state.clientId)}</span></div>
              <div class="meta-row rtl"><span class="label">:معرف الزبون</span><span class="value ${state.clientIdAr ? "" : "empty"}">${escapeHtml(state.clientIdAr)}</span></div>
              <div class="meta-row"><span class="label">Période de garantie :</span><span class="value"> ${wStart} au ${wEnd}</span></div>
              <div class="meta-row rtl"><span class="label">:مدة الضمان</span><span class="value">من ${wStart} إلى ${wEnd}</span></div>
            </section>
            <table class="invoice-lines-table">
              <thead><tr><th class="w1">Appareil</th><th class="wq">Quantité</th><th class="wu">Prix unitaire</th><th class="wt total-col">Total</th></tr></thead>
              <tbody>${rows}</tbody>
              <tfoot><tr><td>Total</td><td>${totalQty}</td><td> - </td><td class="total-col">${fmtMoney(totalAmount)}</td></tr></tfoot>
            </table>
            <div class="cond-title">Conditions de garantie : شروط الضمان</div>
            <div class="cond-body">
              <p>La garantie couvre les pannes techniques résultant d'une utilisation normale de l'appareil, et ne couvre pas la casse, les chutes, l'incendie, la mauvaise utilisation, les surtensions électrique ou toute intervention extérieure.</p>
              <p class="rtl">يغطي الضمان الأعطال الفنية الناتجة عن الاستخدام العادي للجهاز، ولا يغطي الكسر، أو السقوط، أو الحريق، أو سوء الاستخدام، أو ارتفاع مفاجئ في التيار الكهربائي، أو أي تدخل خارجي.</p>
            </div>
            <div class="sig">Signature : <span class="sig-line"></span></div>
          </main>
        `;
      }

      byId("addItemBtn").addEventListener("click", () => {
        const appliance = byId("itemName").value.trim();
        const quantity = Math.max(0, Number(byId("itemQty").value || 0));
        const unitPrice = Math.max(0, Number(byId("itemPrice").value || 0));
        if (!appliance) return;
        state.lines.push({ appliance, quantity, unitPrice });
        byId("itemName").value = "";
        byId("itemQty").value = "1";
        byId("itemPrice").value = "0";
        renderUIItems();
      });

      const modal = byId("modal");
      const modalInner = byId("modalInner");
      byId("previewBtn").addEventListener("click", () => {
        byId("invoiceContainer").innerHTML = invoiceHtml();
        modal.classList.add("open");
      });
      byId("closeBtn").addEventListener("click", () => modal.classList.remove("open"));
      byId("printBtn").addEventListener("click", () => window.print());
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("open"); });
      modalInner.addEventListener("click", (e) => e.stopPropagation());

      bindInputs();
      renderUIItems();
    </script>
